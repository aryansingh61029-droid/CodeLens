name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: docker build -t code-plagiarism-checker:ci .
      - name: Container health smoke test
        shell: bash
        run: |
          export DB_PASSWORD="$(openssl rand -hex 24)"
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export HOST_PORT=18080
          trap 'docker compose -p checker-ci logs; docker compose -p checker-ci down -v' EXIT
          docker compose -p checker-ci up --build -d --wait --wait-timeout 180
          curl --fail --silent http://localhost:18080/actuator/health
          curl --fail --silent http://localhost:18080/api/history
