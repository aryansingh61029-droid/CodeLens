services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: codelens
      MYSQL_USER: ${DB_USERNAME:-codelens}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Authenticated readiness check; passwords stay out of process arguments.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -D codelens -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
  checker:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      APP_MAX_CONCURRENT_REQUESTS: "2"
      DB_URL: "jdbc:mysql://mysql:3306/codelens?connectionTimeZone=UTC"
      DB_USERNAME: ${DB_USERNAME:-codelens}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  mysql_data:
