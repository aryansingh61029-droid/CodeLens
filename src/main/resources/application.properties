spring.application.name=code-plagiarism-checker
server.port=${PORT:8080}
server.address=0.0.0.0
spring.profiles.default=dev
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=0
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-swallow-size=4MB
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=${SERVER_THREADS:16}
server.tomcat.max-connections=${SERVER_MAX_CONNECTIONS:100}
server.tomcat.accept-count=20
app.max-concurrent-requests=${APP_MAX_CONCURRENT_REQUESTS:2}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# MySQL credentials are external configuration. Flyway owns all schema changes.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codelens?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:codelens}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.sql.init.mode=never
management.endpoint.health.group.readiness.include=readinessState,db
